<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>إذاعة القرآن الكريم — بث مباشر 24/7</title>
  <meta name="description" content="إذاعة القرآن الكريم بث مباشر على مدار الساعة، تلاوات لأشهر القراء مع النص العربي والترجمة الإيطالية. Radio del Sacro Corano in diretta 24 ore su 24.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="إذاعة القرآن الكريم — Radio del Sacro Corano">
  <meta property="og:description" content="بث مباشر 24/7 · Diretta 24/7 · نص عربي + ترجمة إيطالية">
  <meta property="og:image" content="icon-512.png">
  <meta name="twitter:card" content="summary">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A2624">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="إذاعة القرآن">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #0A2624;
      --bg-panel: #0F332F;
      --bg-panel-2: #123A35;
      --gold: #C9A050;
      --gold-light: #E8C77E;
      --gold-dim: rgba(201,160,80,0.25);
      --cream: #F3ECDA;
      --sage: #6E9C8D;
      --line: rgba(243,236,218,0.12);
      --shadow-soft: 0 20px 40px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: 
        radial-gradient(circle at 50% -10%, rgba(232,199,126,0.08), transparent 55%),
        radial-gradient(circle at 80% 20%, rgba(110,156,141,0.06), transparent 40%),
        var(--bg-deep);
      color: var(--cream);
      font-family: Tajawal, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 64px;
      overflow-x: hidden;
    }

    /* === الهيدر الزخرفي === */
    .top-band {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      color: var(--gold-light);
      opacity: 0.85;
    }
    .top-band .rule {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
    }
    .top-band svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px rgba(232,199,126,0.3));
    }
    .lang-toggle {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid rgba(232,199,126,0.4);
      color: var(--gold-light);
      font-family: Tajawal, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-toggle:hover {
      background: rgba(232,199,126,0.12);
      border-color: var(--gold-light);
      transform: translateY(-1px);
    }
    .lang-toggle:active {
      transform: scale(0.95);
    }

    /* === الهيدر النصي === */
    header {
      text-align: center;
      margin-bottom: 6px;
    }
    header .eyebrow {
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--sage);
      font-weight: 500;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    header h1 {
      font-family: Amiri, serif;
      font-weight: 700;
      font-size: clamp(30px, 5vw, 46px);
      margin: 0;
      color: var(--cream);
      text-shadow: 0 0 30px rgba(232,199,126,0.15);
    }

    /* === بطاقة المشغل === */
    .stage {
      width: 100%;
      max-width: 560px;
      margin-top: 34px;
      background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 38px 30px 30px;
      position: relative;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }
    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, var(--gold-dim), transparent 60%);
      pointer-events: none;
      opacity: 0.5;
    }
    .stage::after {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(201,160,80,0.25);
      border-radius: 16px;
      pointer-events: none;
    }

    .star-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 22px;
      position: relative;
      z-index: 1;
    }
    .star {
      width: 112px;
      height: 112px;
      transition: filter 0.4s ease;
      filter: drop-shadow(0 0 20px rgba(201,160,80,0.3));
    }
    .star svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .star.playing {
      animation: spin 22s linear infinite;
    }
    .star.playing .glow {
      opacity: 1;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .glow {
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .live-tag {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: var(--gold-light);
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e05a4e;
      box-shadow: 0 0 0 0 rgba(224,90,78,0.6);
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(224,90,78,0.55); }
      70% { box-shadow: 0 0 0 10px rgba(224,90,78,0); }
      100% { box-shadow: 0 0 0 0 rgba(224,90,78,0); }
    }

    .station-name {
      font-family: Amiri, serif;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 4px;
      position: relative;
      z-index: 1;
    }
    .station-sub {
      text-align: center;
      color: var(--sage);
      font-size: 14px;
      margin-bottom: 26px;
      position: relative;
      z-index: 1;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-bottom: 22px;
      position: relative;
      z-index: 1;
    }
    .play-btn {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--bg-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 12px 24px -8px rgba(201,160,80,0.55), 0 0 0 0 rgba(201,160,80,0.3);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .play-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.2), transparent 70%);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 16px 32px -8px rgba(201,160,80,0.65), 0 0 20px rgba(201,160,80,0.4);
    }
    .play-btn:hover::before {
      opacity: 1;
    }
    .play-btn:active {
      transform: scale(0.96);
    }
    .play-btn svg {
      width: 26px;
      height: 26px;
      position: relative;
      z-index: 1;
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 34px;
    }
    .bars span {
      width: 4px;
      background: linear-gradient(180deg, var(--gold-light), var(--gold));
      border-radius: 2px;
      height: 6px;
      opacity: 0.35;
      transition: opacity 0.3s ease, height 0.3s ease;
    }
    .bars.playing span {
      opacity: 1;
      animation: bar 1s ease-in-out infinite;
    }
    .bars span:nth-child(1) { animation-delay: 0s; }
    .bars span:nth-child(2) { animation-delay: 0.15s; }
    .bars span:nth-child(3) { animation-delay: 0.3s; }
    .bars span:nth-child(4) { animation-delay: 0.45s; }
    .bars span:nth-child(5) { animation-delay: 0.2s; }
    @keyframes bar {
      0%, 100% { height: 6px; }
      50% { height: 30px; }
    }

    .vol-row {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 260px;
      margin: 0 auto;
      color: var(--sage);
      position: relative;
      z-index: 1;
    }
    .vol-row svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    input[type="range"] {
      -webkit-appearance: none;
      flex: 1;
      height: 3px;
      background: var(--line);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--gold-light);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(232,199,126,0.4);
      transition: transform 0.15s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* === قسم القائمة === */
    .list-section {
      width: 100%;
      max-width: 720px;
      margin-top: 46px;
    }
    .list-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      color: var(--gold-light);
    }
    .list-heading .rule {
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .list-heading span {
      font-size: 14px;
      letter-spacing: 1px;
      white-space: nowrap;
      font-weight: 600;
    }

    .station-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }
    .station-card {
      text-align: right;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      overflow: hidden;
    }
    .station-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(201,160,80,0.08), transparent 60%);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .station-card:hover {
      border-color: rgba(201,160,80,0.5);
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.3);
    }
    .station-card:hover::before {
      opacity: 1;
    }
    .station-card.active {
      background: linear-gradient(135deg, rgba(201,160,80,0.16), rgba(201,160,80,0.04));
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(201,160,80,0.2);
    }
    .station-card.active::before {
      opacity: 1;
    }

    .station-card .name {
      font-family: Amiri, serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--cream);
      position: relative;
      z-index: 1;
    }
    .station-card .tag {
      font-size: 12px;
      color: var(--sage);
      position: relative;
      z-index: 1;
    }
    .station-card.active .tag {
      color: var(--gold-light);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: relative;
      z-index: 1;
    }
    .card-top .txt {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      flex: 1;
    }
    .avatar {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(201,160,80,0.22), rgba(201,160,80,0.06));
      border: 1px solid var(--gold);
      color: var(--gold-light);
      font-family: Amiri, serif;
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(201,160,80,0.2);
    }
    .card-top .info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .expand-btn {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(243,236,218,0.04);
      color: var(--sage);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .expand-btn:hover {
      border-color: var(--gold);
      color: var(--gold-light);
      background: rgba(201,160,80,0.12);
      transform: scale(1.08);
    }
    .expand-btn.open {
      transform: rotate(180deg) scale(1.08);
      color: var(--gold-light);
      border-color: var(--gold);
      background: rgba(201,160,80,0.16);
    }
    .expand-btn svg {
      width: 13px;
      height: 13px;
    }

    .surah-panel {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
      max-height: 220px;
      overflow-y: auto;
      position: relative;
      z-index: 1;
    }
    .surah-panel.open {
      display: block;
    }
    .surah-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 6px;
    }
    .surah-chip {
      font-size: 12px;
      text-align: center;
      padding: 7px 4px;
      border-radius: 8px;
      background: rgba(243,236,218,0.04);
      border: 1px solid transparent;
      color: var(--cream);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s ease;
    }
    .surah-chip:hover {
      border-color: var(--gold);
      color: var(--gold-light);
      background: rgba(201,160,80,0.08);
      transform: translateY(-1px);
    }
    .surah-chip.active {
      background: rgba(201,160,80,0.22);
      border-color: var(--gold);
      color: var(--gold-light);
      box-shadow: 0 0 10px rgba(201,160,80,0.25);
    }

    /* === قسم المصحف === */
    .mushaf-section {
      width: 100%;
      max-width: 720px;
      margin-top: 22px;
      display: block;
    }
    .mushaf-card {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow-soft);
    }
    .mushaf-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .mushaf-head .title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .mushaf-head .title .t1 {
      font-family: Amiri, serif;
      font-size: 18px;
      color: var(--gold-light);
      font-weight: 700;
    }
    .mushaf-head .title .t2 {
      font-size: 12px;
      color: var(--sage);
    }
    .mushaf-close {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(243,236,218,0.04);
      color: var(--sage);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .mushaf-close:hover {
      border-color: var(--gold);
      color: var(--gold-light);
      background: rgba(201,160,80,0.12);
      transform: scale(1.08);
    }
    .mushaf-body {
      position: relative;
      max-height: 420px;
      overflow-y: auto;
    }
    .ayah-row {
      padding: 12px 10px;
      border-radius: 10px;
      border-bottom: 1px solid rgba(243,236,218,0.06);
      border-inline-start: 3px solid transparent;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .ayah-row:hover {
      background: rgba(201,160,80,0.08);
    }
    .ayah-row.active {
      background: rgba(201,160,80,0.30);
      border-inline-start: 3px solid var(--gold);
      box-shadow: 0 0 22px rgba(201,160,80,0.25);
    }
    .ayah-row.active .italian { color: #fff; }
    .ayah-row.active .arabic {
      color: var(--gold-light);
    }
    .ayah-row.active .arabic .num {
      background: var(--gold);
      color: var(--bg-deep);
    }
    .ayah-row .arabic {
      font-family: Amiri, serif;
      font-size: 21px;
      line-height: 2.1;
      color: var(--cream);
    }
    .ayah-row .arabic .num {
      font-size: 12px;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      margin-inline-start: 6px;
    }
    .ayah-row .italian {
      direction: ltr;
      text-align: left;
      font-size: 17px;
      color: var(--gold-light);
      margin-top: 8px;
      line-height: 1.8;
      font-family: Tajawal, sans-serif;
    }
    .mushaf-loading {
      text-align: center;
      color: var(--sage);
      font-size: 13px;
      padding: 20px 0;
    }

    footer {
      margin-top: 50px;
      color: var(--sage);
      font-size: 13px;
      text-align: center;
      max-width: 520px;
      line-height: 1.9;
    }

    @media (prefers-reduced-motion: reduce) {
      .star.playing { animation: none; }
      .bars.playing span { animation: none; height: 18px; }
      .live-dot { animation: none; }
    }

    @media (max-width: 600px) {
      .stage {
        padding: 28px 20px 24px;
      }
      .station-name {
        font-size: 22px;
      }
      .play-btn {
        width: 58px;
        height: 58px;
      }
      .station-grid {
        grid-template-columns: 1fr;
      }
    }


    /* === مواقيت الصلاة === */
    .prayer-section { width: 100%; max-width: 720px; margin-bottom: 22px; }
    .prayer-card { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; box-shadow: var(--shadow-soft); }
    .prayer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .prayer-head .t1 { display: block; font-family: Amiri, serif; font-size: 18px; color: var(--gold-light); font-weight: 700; }
    .prayer-head .t2 { display: block; font-size: 12px; color: var(--sage); margin-top: 2px; }
    .prayer-actions { display: flex; gap: 8px; align-items: center; }
    .prayer-actions select { background: var(--bg-panel-2); color: var(--cream); border: 1px solid var(--line); border-radius: 20px; padding: 6px 10px; font-family: Tajawal, sans-serif; font-size: 13px; }
    .prayer-next { font-size: 15px; color: var(--cream); margin-bottom: 12px; min-height: 22px; }
    .prayer-next b { color: var(--gold-light); }
    .prayer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
    .prayer-item { text-align: center; padding: 10px 4px; border-radius: 12px; background: rgba(243,236,218,0.04); border: 1px solid transparent; }
    .prayer-item .pn { font-size: 13px; color: var(--sage); }
    .prayer-item .pt { font-size: 20px; font-weight: 700; color: var(--cream); direction: ltr; margin-top: 2px; }
    .prayer-item.next { border-color: var(--gold); background: rgba(201,160,80,0.14); }
    .prayer-item.next .pn, .prayer-item.next .pt { color: var(--gold-light); }
    .prayer-note { font-size: 11px; color: var(--sage); margin-top: 10px; opacity: 0.8; }
    :focus-visible { outline: 2px solid var(--gold-light); outline-offset: 3px; border-radius: 8px; }
    .surah-chip, .card-top .txt { -webkit-tap-highlight-color: transparent; }
    noscript p { text-align:center; color: var(--gold-light); }
  </style>

    function normBase(u) {
      return u.replace(/([^:])\/{2,}/g, '$1/').replace(/\/?$/, '/');
    }

    let allRecitersP = null;
    function resolveStation(s) {
      if (s.resolving) return s.resolving;
      if (!s.rid && !s.find) return Promise.resolve();
      s.resolving = (async () => {
        try {
          let rec;
          if (s.rid) {
            const r = await fetch(`${MP3Q_API}&reciter=${s.rid}`);
            if (!r.ok) throw new Error(`status ${r.status}`);
            rec = ((await r.json()).reciters || [])[0];
          } else {
            if (!allRecitersP) {
              allRecitersP = fetch(MP3Q_API).then(r => {
                if (!r.ok) throw new Error(`status ${r.status}`);
                return r.json();
              }).then(d => d.reciters || []);
            }
            const all = await allRecitersP;
            const toks = [].concat(s.find);
            rec = all.find(x => toks.every(t => x.name.includes(t)));
          }
          const mo = rec && (rec.moshaf.find(m => m.moshaf_type === 11) || rec.moshaf[0]);
          if (mo && mo.server) {
            s.base = normBase(mo.server);
            const l = String(mo.surah_list || '').split(',').map(Number).filter(Boolean);
            if (l.length) s.list = l;
          }
        } catch (e) {
          console.warn('resolve', s.code, e);
          allRecitersP = null;
        }
        s.done = true;
      })();
      return s.resolving;
    }

    function trackUrl(s, num) {
      return `${s.base}${String(num).padStart(3, '0')}.mp3`;
    }

    const READ_IDS = { afs: 123, sds: 54, basit: 53, yasser: 92, husr: 118, minsh: 112, ajm: 5, tblawi: 106 };

    const TEXTS = {

      it: {

    let currentLang = 'ar';
    try { const sv = localStorage.getItem('lang'); if (sv === 'it' || sv === 'ar') currentLang = sv; } catch (e) {}

    function applyLang() {

    async function loadMushaf(stationIndex, surahNum) {
      const s = stations[stationIndex];
      const myToken = ++mushafToken;
      currentTiming = null;
      ayahWeights = [];
      ayahTimings = [];
      lastHighlighted = -1;

      mushafSection.style.display = 'block';
      mushafTitle.textContent = `${SURAH_NAMES[surahNum]} — ${currentLang === 'ar' ? s.name : s.nameIt}`;
      mushafBody.innerHTML = `<div class="mushaf-loading">${TEXTS[currentLang].mushafLoading}</div>`;

      try {
        const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/editions/quran-uthmani,it.piccardo`);
        if (!res.ok) throw new Error(`status ${res.status}`);
        const data = await res.json();
        if (myToken !== mushafToken) return;

        const arabic = data.data[0].ayahs;
        const italian = data.data[1].ayahs;

        mushafBody.innerHTML = '';
        arabic.forEach((a, idx) => {
          const row = document.createElement('div');
          row.className = 'ayah-row';
          row.id = `ayah-${a.numberInSurah}`;
          const ar = document.createElement('div');
          ar.className = 'arabic';
          ar.appendChild(document.createTextNode(a.text));
          const num = document.createElement('span');
          num.className = 'num';
          num.textContent = a.numberInSurah;
          ar.appendChild(num);
          const it = document.createElement('div');
          it.className = 'italian';
          it.textContent = italian[idx] ? italian[idx].text : '';
          row.append(ar, it);
          mushafBody.appendChild(row);
        });

        // تقدير احتياطي: توزيع زمن السورة على الآيات حسب طول النص
        ayahWeights = arabic.map(a => Math.max(1, a.text.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\s]/g, '').length));

        // توقيت دقيق من mp3quran إن توفر
        const readId = s.rid || READ_IDS[s.code];
        if (readId) {
          try {
            const res2 = await fetch(`https://mp3quran.net/api/v3/ayat_timing?surah=${surahNum}&read=${readId}`);
            if (!res2.ok) throw new Error(`status ${res2.status}`);
            const raw = await res2.json();
            const list = (Array.isArray(raw) ? raw : (raw.ayat_timing || raw.data || []))
              .map(t => ({
                ayah: Number(t.ayah ?? t.ayah_number),
                start: Number(t.start_time ?? t.starttime),
                end: Number(t.end_time ?? t.endtime)
              }))
              .filter(t => Number.isFinite(t.ayah) && Number.isFinite(t.start) && Number.isFinite(t.end));
            // الآية 0 = البسملة، تُعرض ضمن الآية 1
            list.forEach(t => { if (t.ayah === 0) t.ayah = 1; });
            if (list.length >= Math.ceil(arabic.length / 2) && myToken === mushafToken) currentTiming = list;
          } catch (e) {
            console.warn('توقيت الآيات (تقدير تلقائي):', e);
          }
        }
      } catch (e) {
        if (myToken === mushafToken) {
          mushafBody.innerHTML = `<div class="mushaf-loading">${TEXTS[currentLang].mushafError}</div>`;
        }
      }
    }

    audio.preload = 'none';

    let playToken = 0;
    let currentIndex = 0;
    let listPos = 0;
    let usingSurah = false;
    let openIndex = -1;

    const grid = document.getElementById('stationGrid');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const star = document.getElementById('star');
    const bars = document.getElementById('bars');
    const stationName = document.getElementById('stationName');
    const stationSub = document.getElementById('stationSub');
    const volume = document.getElementById('volume');

    audio.volume = parseFloat(volume.value);

    function onActivate(el, fn) {
      el.setAttribute('role', 'button');
      el.tabIndex = 0;
      el.addEventListener('click', fn);
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(e); }
      });
    }

    function stName(s) {
      return currentLang === 'ar' ? s.name : s.nameIt;
    }
    function stTag(s) {
      return currentLang === 'ar' ? s.tag : s.tagIt;
    }

    function renderGrid() {
      grid.innerHTML = '';
      stations.forEach((s, i) => {
        if (s.done && !s.base && !s.url) return;
        const card = document.createElement('div');
        card.className = `station-card${i === currentIndex ? ' active' : ''}`;

        const top = document.createElement('div');
        top.className = 'card-top';

        const txt = document.createElement('div');
        txt.className = 'txt';
        txt.innerHTML = `
          <span class="avatar">${s.initial}</span>
          <div class="info">
            <span class="name">${stName(s)}</span>
            <span class="tag">${stTag(s)}</span>
          </div>
        `;
        onActivate(txt, () => selectStation(i, true));
        top.appendChild(txt);

        if (s.list) {
          const btn = document.createElement('button');
          btn.className = `expand-btn${openIndex === i ? ' open' : ''}`;
          btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>`;
          btn.setAttribute('aria-label', currentLang === 'ar' ? 'عرض السور' : 'Mostra sure');
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            openIndex = openIndex === i ? -1 : i;
            renderGrid();
          });
          top.appendChild(btn);
        }

        card.appendChild(top);

        if (s.list) {
          const panel = document.createElement('div');
          panel.className = `surah-panel${openIndex === i ? ' open' : ''}`;
          const list = document.createElement('div');
          list.className = 'surah-list';
          s.list.forEach(num => {
            const chip = document.createElement('div');
            const isActive = i === currentIndex && usingSurah && s.list[listPos] === num;
            chip.className = `surah-chip${isActive ? ' active' : ''}`;
            chip.textContent = SURAH_NAMES[num];
            onActivate(chip, (e) => {
              e.stopPropagation();
              playSurah(i, num);
            });
            list.appendChild(chip);
          });
          panel.appendChild(list);
          card.appendChild(panel);
        }

        grid.appendChild(card);
      });
    }

    function selectStation(i, autoplay) {
      currentIndex = i;
      usingSurah = false;
      listPos = 0;
      currentTiming = null;
      mushafTitle.textContent = TEXTS[currentLang].mushafSub;
      mushafBody.innerHTML = `<div class="mushaf-loading">${TEXTS[currentLang].mushafPlaceholder}</div>`;

      const s = stations[i];
      playToken++;
      if (!s.url && autoplay) { playSurah(i, s.list[0]); return; }
      stationName.textContent = stName(s);
      stationSub.textContent = autoplay ? TEXTS[currentLang].subConnecting : TEXTS[currentLang].subDefault;

      audio.src = s.url || (s.base ? trackUrl(s, s.list[0]) : '');

      renderGrid();

      if (autoplay) {
        audio.play().then(() => {
          setPlayingUI(true);
        }).catch(e => { if (e && e.name !== 'AbortError') stationSub.textContent = TEXTS[currentLang].subErrorRadio; });
      }
    }

    async function playSurah(i, num) {
      const s = stations[i];
      const token = ++playToken;
      if (!s.base && s.find) {
        stationName.textContent = `${stName(s)} — ${SURAH_NAMES[num]}`;
        stationSub.textContent = TEXTS[currentLang].subConnecting;
        await resolveStation(s);
        if (token !== playToken) return;
      }
      if (!s.base) { stationSub.textContent = TEXTS[currentLang].subErrorSurah; return; }
      if (s.list.indexOf(num) === -1) num = s.list[0];

      currentIndex = i;
      usingSurah = true;
      listPos = s.list.indexOf(num);

      stationName.textContent = `${stName(s)} — ${SURAH_NAMES[num]}`;
      stationSub.textContent = TEXTS[currentLang].subConnecting;

      audio.src = trackUrl(s, num);
      renderGrid();
      loadMushaf(i, num);

      audio.play().then(() => {
        setPlayingUI(true);
      }).catch(e => { if (e && e.name !== 'AbortError') stationSub.textContent = TEXTS[currentLang].subErrorSurah; });
    }

    audio.addEventListener('ended', () => {
      const s = stations[currentIndex];
      if (usingSurah && s.list) {
        listPos = (listPos + 1) % s.list.length;
        const num = s.list[listPos];
        stationName.textContent = `${stName(s)} — ${SURAH_NAMES[num]}`;
        audio.src = trackUrl(s, num);
        audio.play().catch(() => {});
        loadMushaf(currentIndex, num);
        renderGrid();
      }
    });

    function setPlayingUI(isPlaying) {
      playIcon.style.display = isPlaying ? 'none' : 'block';
      pauseIcon.style.display = isPlaying ? 'block' : 'none';
      star.classList.toggle('playing', isPlaying);
      bars.classList.toggle('playing', isPlaying);
      playBtn.setAttribute('aria-label', isPlaying ? (currentLang === 'ar' ? 'إيقاف' : 'Pausa') : (currentLang === 'ar' ? 'تشغيل' : 'Play'));
      if (isPlaying && !usingSurah) {
        stationSub.textContent = TEXTS[currentLang].subLive;
      }
      if (isPlaying && usingSurah) {
        stationSub.textContent = TEXTS[currentLang].subSurah;
      }
    }

    playBtn.addEventListener('click', () => {
      if (!audio.src) {
        selectStation(currentIndex, true);
        return;
      }
      if (audio.paused) {
        audio.play().then(() => {
          setPlayingUI(true);
        }).catch(e => { if (e && e.name !== 'AbortError') stationSub.textContent = TEXTS[currentLang].subErrorRadio; });
      } else {
        audio.pause();
        setPlayingUI(false);
        stationSub.textContent = TEXTS[currentLang].subPaused;
      }
    });

    volume.addEventListener('input', () => {
      audio.volume = parseFloat(volume.value);
    });

    audio.addEventListener('waiting', () => {
      stationSub.textContent = TEXTS[currentLang].subLoading;
    });

    let retries = 0;
    audio.addEventListener('playing', () => {
      retries = 0;
      setPlayingUI(true);
      updateMediaSession();
    });

    audio.addEventListener('error', () => {
      if (!usingSurah && audio.src && retries < 3) {
        retries++;
        stationSub.textContent = TEXTS[currentLang].subConnecting;
        setTimeout(() => { audio.load(); audio.play().catch(() => {}); }, 2000 * retries);
        return;
      }
      stationSub.textContent = TEXTS[currentLang].subErrorGeneric;
      setPlayingUI(false);
    });

    function updateMediaSession() {
      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: stationName.textContent,
        artist: 'mp3quran.net',
        album: TEXTS[currentLang].title,
        artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }]
      });
      navigator.mediaSession.setActionHandler('play', () => playBtn.click());
      navigator.mediaSession.setActionHandler('pause', () => playBtn.click());
    }

    function highlightAyah(n) {
      document.querySelectorAll('.ayah-row.active').forEach(el => el.classList.remove('active'));
      const cur = document.getElementById(`ayah-${n}`);
      if (cur) {
        cur.classList.add('active');
        const top = cur.offsetTop - (mushafBody.clientHeight - cur.offsetHeight) / 2;
        mushafBody.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      }
      lastHighlighted = n;
    }

    audio.addEventListener('timeupdate', () => {
      if (!usingSurah) return;
      let ayah = null;
      if (currentTiming) {
        const ms = audio.currentTime * 1000;
        const e = currentTiming.find(t => ms >= t.start && ms < t.end);
        if (e) ayah = e.ayah;
      } else if (ayahWeights.length && isFinite(audio.duration) && audio.duration > 0) {
        const total = ayahWeights.reduce((x, y) => x + y, 0);
        const target = (audio.currentTime / audio.duration) * total;
        let acc = 0;
        ayah = ayahWeights.length;
        for (let i = 0; i < ayahWeights.length; i++) {
          acc += ayahWeights[i];
          if (target < acc) { ayah = i + 1; break; }
        }
      }
      if (ayah !== null && ayah !== lastHighlighted) highlightAyah(ayah);
    });

    mushafClose.addEventListener('click', () => {
      mushafSection.style.display = 'none';
    });

    document.getElementById('langToggle').addEventListener('click', () => {
      currentLang = currentLang === 'ar' ? 'it' : 'ar';
      try { localStorage.setItem('lang', currentLang); } catch (e) {}
      applyLang();
      if (typeof renderGrid === 'function') renderGrid();
    });


    // === مواقيت الصلاة (Aladhan API) ===
    const PT = {
      ar: { title: 'مواقيت الصلاة', next: 'الصلاة القادمة', inn: 'بعد', h: 'س', m: 'د', loading: 'جاري التحميل...', error: 'تعذر تحميل المواقيت',
            mine: 'موقعي الحالي', denied: 'تعذر تحديد الموقع، اختر مدينتك', btn: 'تحديد موقعي',
            note: 'الحساب: رابطة العالم الإسلامي — قد يختلف دقائق قليلة عن مسجدك',
            names: { Fajr: 'الفجر', Sunrise: 'الشروق', Dhuhr: 'الظهر', Asr: 'العصر', Maghrib: 'المغرب', Isha: 'العشاء' } },
      it: { title: 'Orari di preghiera', next: 'Prossima preghiera', inn: 'tra', h: 'h', m: 'm', loading: 'Caricamento...', error: 'Impossibile caricare gli orari',
            mine: 'La mia posizione', denied: 'Posizione non disponibile, scegli la città', btn: 'Rileva posizione',
            note: 'Calcolo: Lega Mondiale Musulmana — può differire di qualche minuto dalla tua moschea',
            names: { Fajr: 'Fajr', Sunrise: 'Alba', Dhuhr: 'Dhuhr', Asr: 'Asr', Maghrib: 'Maghrib', Isha: 'Isha' } }
    };
    const CITIES = [
      { id: 'milano', ar: 'ميلانو', it: 'Milano', lat: 45.4642, lon: 9.19 },
      { id: 'roma', ar: 'روما', it: 'Roma', lat: 41.9028, lon: 12.4964 },
      { id: 'torino', ar: 'تورينو', it: 'Torino', lat: 45.0703, lon: 7.6869 },
      { id: 'napoli', ar: 'نابولي', it: 'Napoli', lat: 40.8518, lon: 14.2681 },
      { id: 'bologna', ar: 'بولونيا', it: 'Bologna', lat: 44.4949, lon: 11.3426 },
      { id: 'firenze', ar: 'فلورنسا', it: 'Firenze', lat: 43.7696, lon: 11.2558 },
      { id: 'genova', ar: 'جنوا', it: 'Genova', lat: 44.4056, lon: 8.9463 },
      { id: 'venezia', ar: 'البندقية', it: 'Venezia', lat: 45.4408, lon: 12.3155 },
      { id: 'bergamo', ar: 'برغامو', it: 'Bergamo', lat: 45.6983, lon: 9.6773 },
      { id: 'brescia', ar: 'بريشيا', it: 'Brescia', lat: 45.5416, lon: 10.2118 },
      { id: 'palermo', ar: 'باليرمو', it: 'Palermo', lat: 38.1157, lon: 13.3615 }
    ];
    const PRAYERS = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
    let ploc = { type: 'city', id: 'milano' };
    let ptimes = null;
    try { const sv = JSON.parse(localStorage.getItem('ploc')); if (sv && sv.type) ploc = sv; } catch (e) {}

    function currentLoc() {
      if (ploc.type === 'geo') {
        return { lat: ploc.lat, lon: ploc.lon, tz: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Rome', geo: true };
      }
      const c = CITIES.find(x => x.id === ploc.id) || CITIES[0];
      return { lat: c.lat, lon: c.lon, tz: 'Europe/Rome', city: c };
    }
    function tzNow(tz) {
      const o = {};
      new Intl.DateTimeFormat('en-GB', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false })
        .formatToParts(new Date()).forEach(p => { o[p.type] = p.value; });
      return { date: `${o.day}-${o.month}-${o.year}`, sec: (Number(o.hour) % 24) * 3600 + Number(o.minute) * 60 + Number(o.second) };
    }
    function toSec(str) {
      const m = String(str).match(/(\d{1,2}):(\d{2})/);
      return m ? Number(m[1]) * 3600 + Number(m[2]) * 60 : 0;
    }
    function hhmm(str) {
      const m = String(str).match(/(\d{1,2}):(\d{2})/);
      return m ? `${m[1].padStart(2, '0')}:${m[2]}` : '--:--';
    }
    function savePloc() { try { localStorage.setItem('ploc', JSON.stringify(ploc)); } catch (e) {} }

    function renderCitySelect() {
      const sel = document.getElementById('prayerCity');
      const t = PT[currentLang];
      sel.innerHTML = '';
      if (ploc.type === 'geo') {
        const o = document.createElement('option');
        o.value = 'geo'; o.textContent = `📍 ${t.mine}`;
        sel.appendChild(o);
      }
      CITIES.forEach(c => {
        const o = document.createElement('option');
        o.value = c.id; o.textContent = currentLang === 'ar' ? c.ar : c.it;
        sel.appendChild(o);
      });
      sel.value = ploc.type === 'geo' ? 'geo' : ploc.id;
      document.getElementById('prayerLocBtn').setAttribute('aria-label', t.btn);
      document.getElementById('prayerLocBtn').title = t.btn;
    }

    function renderPrayer() {
      const t = PT[currentLang];
      document.getElementById('prayerTitle').textContent = t.title;
      document.getElementById('prayerNote').textContent = t.note;
      renderCitySelect();
      const loc = currentLoc();
      document.getElementById('prayerPlace').textContent = loc.geo ? t.mine : (currentLang === 'ar' ? loc.city.ar : loc.city.it);
      const grid = document.getElementById('prayerGrid');
      const nextEl = document.getElementById('prayerNext');
      if (!ptimes) { return; }

      const now = tzNow(loc.tz).sec;
      const five = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
      let next = five.find(k => toSec(ptimes.t[k]) > now);
      let diff;
      if (next) diff = toSec(ptimes.t[next]) - now;
      else { next = 'Fajr'; diff = 86400 - now + toSec(ptimes.t.Fajr); }
      const hh = Math.floor(diff / 3600), mm = Math.floor((diff % 3600) / 60);
      nextEl.innerHTML = `${t.next}: <b>${t.names[next]}</b> ${t.inn} ${hh ? hh + t.h + ' ' : ''}${mm}${t.m}`;

      grid.innerHTML = '';
      PRAYERS.forEach(k => {
        const d = document.createElement('div');
        d.className = `prayer-item${k === next ? ' next' : ''}`;
        const pn = document.createElement('div'); pn.className = 'pn'; pn.textContent = t.names[k];
        const pt = document.createElement('div'); pt.className = 'pt'; pt.textContent = hhmm(ptimes.t[k]);
        d.append(pn, pt);
        grid.appendChild(d);
      });
    }

    async function loadPrayer() {
      const t = PT[currentLang];
      const loc = currentLoc();
      const now = tzNow(loc.tz);
      const key = `pt:${loc.lat.toFixed(2)},${loc.lon.toFixed(2)}:${now.date}`;
      let times = null;
      try { times = JSON.parse(localStorage.getItem(key)); } catch (e) {}
      if (!times) {
        document.getElementById('prayerNext').textContent = t.loading;
        try {
          const r = await fetch(`https://api.aladhan.com/v1/timings/${now.date}?latitude=${loc.lat}&longitude=${loc.lon}&method=3`);
          if (!r.ok) throw new Error(`status ${r.status}`);
          times = (await r.json()).data.timings;
          try { localStorage.setItem(key, JSON.stringify(times)); } catch (e) {}
        } catch (e) {
          console.warn('prayer', e);
          document.getElementById('prayerNext').textContent = t.error;
          return;
        }
      }
      ptimes = { t: times, date: now.date };
      renderPrayer();
    }

    document.getElementById('prayerCity').addEventListener('change', (e) => {
      if (e.target.value === 'geo') return;
      ploc = { type: 'city', id: e.target.value };
      savePloc(); ptimes = null; loadPrayer();
    });
    document.getElementById('prayerLocBtn').addEventListener('click', () => {
      if (!navigator.geolocation) { document.getElementById('prayerNext').textContent = PT[currentLang].denied; return; }
      navigator.geolocation.getCurrentPosition((pos) => {
        ploc = { type: 'geo', lat: pos.coords.latitude, lon: pos.coords.longitude };
        savePloc(); ptimes = null; loadPrayer();
      }, () => {
        document.getElementById('prayerNext').textContent = PT[currentLang].denied;
      }, { timeout: 10000, maximumAge: 3600000 });
    });
    setInterval(() => {
      if (!ptimes) return;
      if (tzNow(currentLoc().tz).date !== ptimes.date) loadPrayer(); else renderPrayer();
    }, 30000);

    renderGrid();
    applyLang();
    selectStation(0, false);
    renderCitySelect();
    loadPrayer();
    Promise.all(stations.filter(x => x.rid).map(resolveStation)).then(renderGrid);
    setTimeout(() => {
      Promise.all(stations.filter(x => x.find).map(resolveStation)).then(renderGrid);
    }, 2500);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
